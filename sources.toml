[[search]]
name = "Определения ВС РФ по ОСАГО"
kind = "vs"
queries = [
  "site:vsrf.ru ОСАГО определение судебной коллегии по гражданским делам {year}",
  "site:vsrf.ru страховое возмещение восстановительный ремонт определение {year}",
  "site:vsrf.ru неустойка финансовый уполномоченный ОСАГО определение {year}",
]
allow = 'https?://(www\.)?vsrf\.ru/lk/practice/stor_pdf/\d+'
require = ["страхов", "транспортн"]
tags = ["ОСАГО"]
max_new = 15

