# Скопируйте этот файл в config.toml и при необходимости поправьте.

# Папка, где агент хранит всё: «Входящие», «Дела», «Библиотека».
home = "~/ЮрАгент"

# Адрес Ollama на этом компьютере (по умолчанию менять не нужно).
ollama_url = "http://127.0.0.1:11434"

# Языки распознавания сканов.
tesseract_lang = "rus+eng"

[models]
# Основная модель: помещается в 8 ГБ видеопамяти (RTX 4060).
chat = "qwen3.5:9b"
# Модель для поиска по смыслу (эмбеддинги), понимает русский.
embed = "bge-m3"
